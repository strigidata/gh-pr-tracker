[package]
name = "prtrack-cli"
version = "0.1.4"
edition.workspace = true
license.workspace = true

# The crate is `prtrack-cli` because the library half lives beside it, but the
# thing a person types is `prtrack` — which is what every message it prints
# already calls itself, down to `prtrack: could not prepare a GitHub client`.
[[bin]]
name = "prtrack"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
notify-rust = { workspace = true }
prtrack-core = { path = "../prtrack-core" }
prtrack-github = { path = "../prtrack-github" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The library half of this crate reports typed failures -- the watcher has to
# tell an unreadable state file from an unwritable one -- so it wants an error
# enum, while `main` still wraps everything in anyhow at the top.
thiserror = { workspace = true }
tokio = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true
