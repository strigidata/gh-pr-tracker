[package]
name = "prtrack-ffi"
version = "0.0.0"
description = "The UniFFI boundary the macOS app links. A shell: nothing depends on it."
edition.workspace = true
license.workspace = true
publish = false

# `staticlib` is what the SwiftPM app links, and what bindings are generated
# from: uniffi_bindgen 0.32's library mode reads an `ar` archive through goblin,
# so `uniffi-bindgen generate --library target/release/libprtrack_ffi.a` works.
# `lib` is there only so the integration tests under `tests/` can link the
# crate.
[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
prtrack-core = { path = "../prtrack-core" }
prtrack-github = { path = "../prtrack-github" }
thiserror = { workspace = true }
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
