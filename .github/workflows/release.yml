name: Release

# Cuts a release from a tag: a universal macOS binary, a checksum, and notes.
#
# Deliberately hand-written rather than generated by `cargo-dist`. This ships to
# one team on one platform, and forty legible lines beat a generated pipeline
# nobody here has read. When distribution goes public — more platforms,
# installers, signing, self-update — `dist` is the right tool and this is the
# thing it replaces.
#
# **The binary is not signed or notarized.** macOS quarantines anything
# downloaded from the internet, so a fresh install needs the quarantine
# attribute cleared by hand. That is acceptable for a team who can be told why;
# it is not acceptable for a stranger, and it is the gate to public
# distribution. See the release notes this generates.

on:
  push:
    tags: ["v*"]
  # So a release can be cut without pushing a tag first, when testing the
  # pipeline itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  # Creating the release and uploading assets.
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate every push runs. A release built from a commit whose tests
  # were never run is a release nobody can vouch for.
  gate:
    uses: ./.github/workflows/ci.yml

  # Debian is a target machine, so a release without a Linux artefact is a
  # release half the team cannot install. Built on Linux natively rather than
  # cross-compiled from the macOS runner, because `ring` compiles C and cross
  # toolchains are a source of failures nobody wants to debug at release time.
  linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build a static binary
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --locked -p prtrack-cli --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/prtrack
          "$BIN" --version
          # Same property the gate asserts: nothing resolved at load time, so it
          # runs on a Debian older than the one that built it.
          if ldd "$BIN" 2>&1 | grep -q "=>"; then
            echo "expected no shared library dependencies"; ldd "$BIN"; exit 1
          fi
          mkdir -p dist && cp "$BIN" dist/prtrack

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="prtrack-$TAG-linux-x86_64"
          tar -czf "$NAME.tar.gz" -C dist prtrack
          sha256sum "$NAME.tar.gz" >"$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: prtrack-*-linux-x86_64.tar.gz*

  release:
    needs: [gate, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        env:
          # Read through the environment rather than interpolated into the
          # script, so a tag name cannot become shell.
          PUSHED_REF: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-$PUSHED_REF}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "refusing a tag that is not vN...: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Check the tag matches the crate version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          CRATE=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="prtrack-cli"))')
          if [ "v$CRATE" != "$TAG" ]; then
            echo "tag $TAG does not match crate version $CRATE"
            echo "a release whose version lies is one nobody can report a bug against"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p prtrack-cli --target aarch64-apple-darwin
          cargo build --release --locked -p prtrack-cli --target x86_64-apple-darwin

      - name: Fuse them into one universal binary
        run: |
          set -euo pipefail
          mkdir -p dist
          # One file that runs on Apple Silicon and Intel. A team should not have
          # to know which Mac they are on to pick a download.
          lipo -create -output dist/prtrack \
            target/aarch64-apple-darwin/release/prtrack \
            target/x86_64-apple-darwin/release/prtrack
          lipo -info dist/prtrack
          ./dist/prtrack --version

      - name: Collect the Linux artefact
        uses: actions/download-artifact@v4
        with:
          name: linux

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          NAME="prtrack-$TAG-macos-universal"
          tar -czf "$NAME.tar.gz" -C dist prtrack
          shasum -a 256 "$NAME.tar.gz" >"$NAME.tar.gz.sha256"
          echo "name=$NAME" >>"$GITHUB_OUTPUT"
          cat "$NAME.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          cat >notes.md <<'NOTES'
          ## Install

          **macOS** — one universal binary, Apple Silicon and Intel:

          ```bash
          gh release download TAG_PLACEHOLDER --repo strigidata/gh-pr-tracker --pattern '*macos*.tar.gz'
          tar -xzf prtrack-TAG_PLACEHOLDER-macos-universal.tar.gz
          xattr -d com.apple.quarantine prtrack   # see below
          install -m 755 prtrack /usr/local/bin/prtrack
          ```

          **Linux** — statically linked, so it runs on any glibc, including a
          Debian older than the machine that built it:

          ```bash
          gh release download TAG_PLACEHOLDER --repo strigidata/gh-pr-tracker --pattern '*linux*.tar.gz'
          tar -xzf prtrack-TAG_PLACEHOLDER-linux-x86_64.tar.gz
          sudo install -m 755 prtrack /usr/local/bin/prtrack
          ```

          ## Why macOS needs the `xattr` line

          This binary is **not signed or notarized**. macOS quarantines anything
          downloaded from the internet and refuses to run it with "cannot be
          opened because the developer cannot be verified". Clearing the
          attribute is the fix, and you should only do it for a binary whose
          origin you trust — which, for a private repo you have access to, you
          do.

          Signing needs an Apple Developer Program membership and a
          notarization step in this workflow. It is the gate to giving this to
          anyone outside the team, not a nicety. Linux has no equivalent
          obstacle.

          ## Use

          ```bash
          export GH_TOKEN=...          # or GITHUB_TOKEN; never passed as a flag
          prtrack board --repo owner/name
          prtrack board --repo owner/name --watch
          ```

          `--watch` polls every five minutes and notifies only when a pull
          request crosses a threshold that matters — became ready to merge, went
          from approved to conflicting, a required check went red, a review was
          requested of you, an approval was dismissed by a push.

          Notifications are quietly swallowed by a macOS Focus mode, and on
          Linux they need a desktop session with a D-Bus notification daemon.
          `prtrack` says so at startup in both cases rather than letting you
          conclude it is broken.

          ## Verify what you downloaded

          ```bash
          shasum -a 256 -c prtrack-TAG_PLACEHOLDER-macos-universal.tar.gz.sha256
          sha256sum -c prtrack-TAG_PLACEHOLDER-linux-x86_64.tar.gz.sha256
          ```
          NOTES
          sed -i '' "s/TAG_PLACEHOLDER/$TAG/g" notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            "$NAME.tar.gz" \
            "$NAME.tar.gz.sha256" \
            prtrack-*-linux-x86_64.tar.gz \
            prtrack-*-linux-x86_64.tar.gz.sha256
