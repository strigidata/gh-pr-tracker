name: Release

# Cuts a release from a tag: a universal macOS binary, a static Linux binary,
# checksums, and notes.
#
# Deliberately hand-written rather than generated by `cargo-dist`. This ships to
# one team on two platforms, and forty legible lines beat a generated pipeline
# nobody here has read. When distribution goes public — more platforms,
# installers, signing, self-update — `dist` is the right tool and this is the
# thing it replaces.
#
# # No compiler runs here
#
# The gate builds every artefact this ships — the musl binary and the macOS
# universal one — and hands both over. This downloads, packages and publishes.
# Building the macOS pair here instead meant a cold cache in a separate runner
# doing work the warm one had a head start on.
#
# **The binaries are not signed or notarized.** A browser download is
# quarantined by macOS and needs the attribute cleared by hand; a `gh` download
# is not, because the API is not LaunchServices. That is acceptable for a team
# who can be told why, and it is the gate to public distribution.

# # Merging the version bump is the release
#
# There is no tag to remember to push. A pull request that raises
# `prtrack-cli`'s version *is* the release: merge it, and this notices that no
# tag matches the new version, cuts one, and publishes. Nothing else on `main`
# triggers anything, because every other commit leaves the version alone.
#
# That removes the failure this repository already had — a tag pushed ten
# minutes before a fix landed, shipping the bug — because the version and the
# code can no longer disagree about which commit is the release.

on:
  push:
    branches: [main]
  # So the pipeline can be exercised, or a release re-cut, by hand.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Does the version on `main` already have a release? Cheap, and it keeps the
  # expensive jobs from starting on the ninety-nine commits out of a hundred
  # that are not a release.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are the state this reads, and a shallow clone has none.
          fetch-depth: 0

      - name: Compare the crate version against the tags
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="prtrack-cli"))')
          TAG="v$VERSION"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "$TAG is new; this commit is a release."
            echo "release=true" >>"$GITHUB_OUTPUT"
          fi

  # The gate for every commit on `main`, release or not. It runs unconditionally
  # because `ci.yml` no longer has a push trigger of its own: this is the only
  # thing verifying the default branch, and skipping it on non-release commits
  # would leave most of `main` unchecked.
  #
  # It publishes the Linux binary only when a release is going to collect it.
  gate:
    needs: decide
    uses: ./.github/workflows/ci.yml
    with:
      upload_artifact: ${{ needs.decide.outputs.release == 'true' }}

  release:
    needs: [decide, gate]
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      # Creating the tag, the release, and its assets.
      contents: write
    # A named environment, so a required reviewer can be added later without
    # touching this file. Publishing is the one step here that cannot be undone
    # quietly.
    environment: release
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Named one at a time rather than matched by a pattern: a glob that
      # silently matches nothing would leave the packaging step tarring an
      # empty directory, and a release of nothing is worse than a failed one.
      - name: Collect the macOS binary the gate built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-universal
          path: dist

      - name: Collect the Linux binary the gate built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-musl
          path: linux

      - name: Check they are what they claim to be
        run: |
          set -euo pipefail
          # An artefact loses its permission bits in transit.
          chmod 755 dist/prtrack linux/prtrack
          # Both halves present, or the universal binary is not universal.
          lipo -info dist/prtrack | grep -q "x86_64 arm64" \
            || { echo "expected a fat binary, got:"; lipo -info dist/prtrack; exit 1; }
          ./dist/prtrack --version
          file linux/prtrack

      - name: Package
        id: package
        run: |
          set -euo pipefail
          MAC="prtrack-$TAG-macos-universal"
          LNX="prtrack-$TAG-linux-x86_64"

          tar -czf "$MAC.tar.gz" -C dist prtrack
          shasum -a 256 "$MAC.tar.gz" >"$MAC.tar.gz.sha256"

          tar -czf "$LNX.tar.gz" -C linux prtrack
          shasum -a 256 "$LNX.tar.gz" >"$LNX.tar.gz.sha256"

          echo "mac=$MAC" >>"$GITHUB_OUTPUT"
          echo "lnx=$LNX" >>"$GITHUB_OUTPUT"
          cat "$MAC.tar.gz.sha256" "$LNX.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MAC: ${{ steps.package.outputs.mac }}
          LNX: ${{ steps.package.outputs.lnx }}
        run: |
          set -euo pipefail
          cat >notes.md <<'NOTES'
          ## Install

          **macOS** — one universal binary, Apple Silicon and Intel:

          ```bash
          gh release download TAG_PLACEHOLDER --repo strigidata/gh-pr-tracker --pattern '*macos*.tar.gz'
          tar -xzf prtrack-TAG_PLACEHOLDER-macos-universal.tar.gz
          install -m 755 prtrack "$(brew --prefix)/bin/prtrack"   # or any dir on your PATH
          ```

          **Linux** — statically linked, so it runs on any glibc, including a
          Debian older than the machine that built it:

          ```bash
          gh release download TAG_PLACEHOLDER --repo strigidata/gh-pr-tracker --pattern '*linux*.tar.gz'
          tar -xzf prtrack-TAG_PLACEHOLDER-linux-x86_64.tar.gz
          install -m 755 prtrack ~/.local/bin/prtrack             # or sudo into /usr/local/bin
          ```

          `/usr/local/bin` is **not** writable without `sudo` on Apple Silicon,
          which is why the Homebrew prefix is used above. Any directory on your
          `PATH` will do.

          Verify what you downloaded:

          ```bash
          shasum -a 256 -c prtrack-TAG_PLACEHOLDER-macos-universal.tar.gz.sha256
          sha256sum -c prtrack-TAG_PLACEHOLDER-linux-x86_64.tar.gz.sha256
          ```

          ## Signing

          These binaries are **not signed or notarized**. Downloaded with `gh`
          as above that does not matter — the API is not LaunchServices, so
          nothing tags the file. Downloaded through a **browser** the macOS one
          is quarantined and refuses to run, which needs
          `xattr -d com.apple.quarantine prtrack` first.

          Signing needs an Apple Developer Program membership and a
          notarization step in this workflow. It is the gate to giving this to
          anyone outside the team, not a nicety. Linux has no equivalent
          obstacle.

          ## Use

          ```bash
          export GH_TOKEN=...          # or GITHUB_TOKEN; never passed as a flag
          prtrack board --repo owner/name
          prtrack board --repo owner/name --watch
          ```

          `--watch` polls every five minutes and notifies only when a pull
          request crosses a threshold that matters — became ready to merge, went
          from approved to conflicting, a required check went red, a review was
          requested of you, an approval was dismissed by a push.

          Notifications are quietly swallowed by a macOS Focus mode, and on
          Linux they need a desktop session with a D-Bus notification daemon.
          `prtrack` says so at startup in both cases rather than letting you
          conclude it is broken.
          NOTES
          sed -i '' "s/TAG_PLACEHOLDER/$TAG/g" notes.md

          # The tag is created here rather than pushed by hand, so it always
          # points at the commit that was actually built and tested.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            "$MAC.tar.gz" "$MAC.tar.gz.sha256" \
            "$LNX.tar.gz" "$LNX.tar.gz.sha256"
