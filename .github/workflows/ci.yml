name: CI

# The gate `AGENTS.md` calls the Definition of Done.
#
# Every step passes `--locked`. A build that silently updates `Cargo.lock` is not
# the build anybody reviewed.
#
# # Compile once per (target, profile), not once per step
#
# `cargo clippy --all-targets` and `cargo test` share a debug build; a separate
# `cargo build --all-targets` re-checks what both already did. And a `--release`
# smoke run shares nothing with either — a second full compilation of the
# dependency tree to test exit codes that are identical in either profile. Both
# were here and both are gone.
#
# The Linux job stays on one target for the same reason: clippy against musl and
# tests against the host gnu triple is two dependency trees where one will do.

# **No `push` trigger.** A merge to `main` runs `release.yml`, whose first job
# calls this one — so a push trigger here meant two full gates per merge, racing
# for the same concurrency group, one cancelling the other. A cancelled run on
# `main` reads as a broken build, and the second gate was duplicated work
# regardless.
on:
  pull_request:
  workflow_call:
    inputs:
      upload_artifact:
        description: "Publish the Linux binary for a release job to collect"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # A CI failure that only says "error" costs a re-run to diagnose.
  RUST_BACKTRACE: 1
  # Nothing is rebuilt incrementally across runs, and the files cost cache space.
  CARGO_INCREMENTAL: 0

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  #
  # Keyed by workflow as well as ref. When this is called from another workflow
  # `github.workflow` is the *caller's* name, so a reusable invocation and a
  # direct one can never collide — which they did, and one cancelled the other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never on `main`: a cancelled gate there is indistinguishable from a broken
  # one, and it is the branch releases are cut from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege, stated rather than inherited. Nothing in the gate writes.
permissions:
  contents: read

jobs:
  macos:
    # macOS carries the full gate because the notification path links AppKit and
    # its failure modes are the hardest here to reason about.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Cheapest first: a formatting failure is instant to find and makes
      # clippy's output diff-noisy if left in.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Docs
        # A broken intra-doc link means a comment references something that no
        # longer exists, so it is a failure rather than a warning.
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # A green suite does not prove the binary works. These are the properties
      # a test cannot reach: that the process starts, that its exit codes are
      # the contract, and that piped output is data rather than escapes.
      #
      # Run against the *debug* binary, which clippy and the tests have already
      # built. No assertion here can tell the two profiles apart.
      - name: Smoke — the binary answers without a token
        run: |
          # No `set -e`. This step asserts on exit codes and the runner's shell
          # treats a non-zero one as fatal, so the check that matters most --
          # "a missing token exits 3" -- killed the step before it could be
          # inspected. Every status is captured explicitly instead.
          set -u
          cargo build --locked -p prtrack-cli || exit 1
          BIN=./target/debug/prtrack

          "$BIN" --version || exit 1

          # `--help` and `--version` are successes. This regressed once already,
          # exiting 2 while claiming the command line could not be read.
          code=0; "$BIN" --help >/dev/null 2>&1 || code=$?
          test "$code" -eq 0 || { echo "--help must exit 0, got $code"; exit 1; }

          # A missing token is an auth failure, distinct from a usage error and
          # from a network one. The exit code is the only part a script reads.
          code=0
          env -u GH_TOKEN -u GITHUB_TOKEN "$BIN" board --repo octo-org/example \
            >/dev/null 2>/tmp/err.txt || code=$?
          test "$code" -eq 3 || { echo "no token must exit 3, got $code"; cat /tmp/err.txt; exit 1; }
          grep -q "GH_TOKEN" /tmp/err.txt || { echo "the message must name the variable"; exit 1; }

          # A bad command line is a usage error and must not be confused with
          # the above. The value of either is that they are different numbers.
          code=0; "$BIN" board >/dev/null 2>&1 || code=$?
          test "$code" -eq 2 || { echo "a missing --repo must exit 2, got $code"; exit 1; }

          # A token must never reach stderr, however the run fails.
          if grep -qE "ghp_|github_pat_" /tmp/err.txt; then
            echo "a credential reached stderr"; exit 1
          fi

          echo "smoke: exit codes are the contract, and they hold"

  # Debian is a target, so a Linux break must fail here rather than at release
  # time. This job exists because one did: `adopt_bundle_identity` is macOS-only
  # and was called unconditionally, so the Linux build did not compile and a
  # macOS-only gate could never have said so.
  #
  # musl, statically linked, because a binary built against the runner's glibc
  # refuses to start on an older Debian — "works on the machine that built it"
  # is not a distribution.
  linux:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          rustup component add clippy
          rustup target add "$TARGET"
          # `ring` compiles C, so building for musl needs a musl C compiler even
          # though everything else here is pure Rust.
          sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ env.TARGET }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --target "$TARGET" -- -D warnings

      - name: Test
        # The same target as clippy, so the debug artefacts are shared rather
        # than a second dependency tree. musl binaries run fine on the runner.
        run: cargo test --workspace --all-features --locked --target "$TARGET"

      - name: Build the artefact the release ships
        run: |
          set -euo pipefail
          cargo build --release --locked -p prtrack-cli --target "$TARGET"
          BIN="target/$TARGET/release/prtrack"
          "$BIN" --version

          # Static, or it is not portable and the musl target bought nothing.
          #
          # Tested as a property, not a phrase. Two earlier versions asserted on
          # the exact wording of `ldd` and then of `file`, and both failed a
          # binary that was already correct: ldd says "statically linked" where
          # the guess is "not a dynamic executable", and file says "static-pie
          # linked" where the guess is "statically linked". What matters is that
          # nothing resolves at load time, which is the absence of any `=>`.
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -q "=>"; then
            echo "expected no shared library dependencies, got:"; ldd "$BIN"; exit 1
          fi
          mkdir -p dist && cp "$BIN" dist/prtrack

      # Only when a release is going to collect it. Asked as an input rather
      # than guessed from the ref, because there is no tag at this point — the
      # release creates one *after* this passes.
      - name: Hand the binary to the release job
        if: inputs.upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-musl
          path: dist/prtrack
          retention-days: 1
